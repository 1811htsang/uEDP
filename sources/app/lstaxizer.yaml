sigs:
  '1': &sig1
    hex_val: '0x1'
    id_symbol: SIG_USR_START
  '2': &sig2
    hex_val: '0x2'
    id_symbol: SIG_USR_STOP
  '3': &sig3
    hex_val: '0x3'
    id_symbol: SIG_0X34
  '4': &sig4
    hex_val: '0x4'
    id_symbol: SIG_0XFF
  '5': &sig5
    hex_val: '0x5'
    id_symbol: SIG_0X12
  '6': &sig6
    hex_val: '0x6'
    id_symbol: SIG_0XAA
  '7': &sig7
    hex_val: '0x7'
    id_symbol: SIG_HALT_NOW
tnorms:
  '1': &tnorm1-ctrl
    fsm_resrc:
      object: FSM_TASK_1_ID
      states:
      - FSM_TASK_1_STATE_1_ID
      - FSM_TASK_1_STATE_2_ID
    handler: tnorm_usr_nhler
    hex_val: '0xe6'
    id_symbol: TASK_NORM_USR
    queue_name: tnorm_usr_msgq
    tsm_resrc:
      object: tsm_task_usr
      state_trans:
      - tsm_task_usr_state_idle_trans
      - tsm_task_usr_state_running_trans
      states:
      - tsm_task_usr_state_idle
      - tsm_task_usr_state_running
      table: tsm_task_usr_tbl
  '2': &tnorm2-ctrl
    fsm_resrc:
      object: FSM_TASK_2_ID
      states:
      - FSM_TASK_2_STATE_1_ID
      - FSM_TASK_2_STATE_2_ID
    handler: tnorm_a_nhler
    hex_val: '0xe7'
    id_symbol: TASK_NORM_A
    queue_name: tnorm_a_msgq
    tsm_resrc:
      object: tsm_task_a
      state_trans:
      - tsm_task_a_state_idle_trans
      - tsm_task_a_state_waiting_trans
      states:
      - tsm_task_a_state_idle
      - tsm_task_a_state_waiting
      table: tsm_task_a_tbl
  '3': &tnorm3-ctrl
    fsm_resrc:
      object: fsm_task_b
      states:
      - fsm_task_b_state_idle
      - fsm_task_b_state_busy
    handler: tnorm_b_nhler
    hex_val: '0xe8'
    id_symbol: TASK_NORM_B
    queue_name: tnorm_b_msgq
    tsm_resrc:
      object: TSM_TASK_3_ID
      state_trans:
      - TSM_TASK_3_STATE_1_ID_trans
      - TSM_TASK_3_STATE_2_ID_trans
      states:
      - TSM_TASK_3_STATE_1_ID
      - TSM_TASK_3_STATE_2_ID
      table: TSM_TASK_3_ID_tbl
tpolls:
  '1': &tpoll1
    handler: tpoll_memrp
    hex_val: '0xd4'
    id_symbol: TASK_POLL_MEMRP
  '2': &tpoll2
    handler: tpoll_blink
    hex_val: '0xd5'
    id_symbol: TASK_POLL_BLINK

# Anchor: sử dụng &<str> để định danh các phần tử 
# >> sigs: &siglst
# >>  '1', '2' of sigs: &sig1, &sig2, ...
# >> tnorms: &tnormlst
# >>  '1', '2' of tnorms: &tnorm1, &tnorm2, ...
# >>  fsm of '1', '2': &tnorm1-fsmobj, &tnorm2-fsmobj, ...
# >>    states of '1'[fsm], '2'[fsm]: &tnorm1-fsmstates, &tnorm2-fsmstates, ...
# >>  tsm of '1', '2': &tnorm1-tsmobj, &tnorm2-tsmobj, ...
# >>    states of '1'[tsm], '2'[tsm]: &tnorm1-tsmstates, &tnorm2-tsmstates, ...
# >>    state trans of '1', '2': &tnorm1-tsmtrans, &tnorm2-tsmtrans, ...
# >> tpolls: &tpolllst
# >>  '1', '2' of tpolls: &tpoll1, &tpoll2, ...
# Alias: sử dụng *<str> để tham chiếu đến các phần tử đã định danh

# NOTE - Triển khai logic bắt đầu từ dòng này

pject: "uEDP_PingPong_Full_Validation"
versh: "1.2.0-pre"

# ANCHOR - Global Data Area (GDA) - Biến toàn cục

glbda:
- '1': &gda_status
  name: GDA_SYSTEM_STATUS # Validator check: kiểm tra lỗi từ lstaxer.strucjec
  type: "const char*"
  initial_value: "STATUS: INITIALIZING"
- '2': &gda_counter
  name: GDA_COUNTER
  type: "int"
  initial_value: 0
- '3': &gda_flag
  name: GDA_FLAG
  type: "bool"
  initial_value: false

# ANCHOR - Task List (TLIST)

tlist:
- tnorm: TASK_NORM_USR
  tsm:
  - id: tsm_task_usr_state_idle
    trans:
    - sig: *sig1
      goto: tsm_task_usr_state_running
    on_ntry: # NOTE - logic "khởi tạo" (Entry)
      steps:
      - actv: uedp_itnlog_init()
        to: NULL
        sig: NULL
        data: NULL
        ptype: NULL
      - actv: uedp_itnlog_set_output(pal_logdp_dispatch)
        to: NULL
        sig: NULL
        data: NULL
        ptype: NULL
    on_actv: # NOTE - logic "chạy" (Active)
      steps:
      - actv: uedp_itnlog_log
        to: NULL
        sig: NULL
        data: "[USR][IDLE] Starting sequence..."
        ptype: NULL
      - actv: uedp_task_norm_post_msg
        to: TASK_NORM_A
        sig: *sig1
        data: NULL
        ptype: NULL
    on_exit: # NOTE - logic "kết thúc" (Exit)
      actv: uedp_itnlog_log
      to: NULL
      sig: NULL
      data: "[USR][IDLE] Sequence finished."
      ptype: NULL
  - id: tsm_task_usr_state_running
    trans:
    - sig: *sig2
      goto: tsm_task_usr_state_idle
    on_ntry:
      actv: uedp_itnlog_log
      to: NULL
      sig: NULL
      data: "[USR][RUNNING] Sequence started."
      ptype: NULL
    on_actv:
      steps:
      - actv: uedp_itnlog_log
        to: NULL
        sig: NULL
        data: "[USR][RUNNING] Posting message to TASK_NORM_A..."
        ptype: NULL
      - actv: uedp_task_norm_post_msg
        to: TASK_NORM_A
        sig: *sig1
        data: *gda_status   # Validator check: tham chiếu anchor hợp lệ
        ptype: REF          # D2MP: Truyền địa chỉ chuỗi status
    on_exit:
      steps:
      - actv: ocesvc_register
        to: NULL
        sig: NULL
        data: itnlog_dump_svc
        ptype: NULL
  << : *tnorm1-ctrl
- tnorm: TASK_NORM_A
  tsm:
  - id: tsm_task_a_state_idle
    trans:
    - sig: *sig1
      goto: tsm_task_a_state_waiting
    on_ntry: NULL
    on_actv: NULL
    on_exit: NULL
  - id: tsm_task_a_state_waiting
    trans:
    - sig: *sig3
      goto: STAY            # Validator check: logic "bỏ qua" (Stay)
    - sig: *sig4
      goto: tsm_task_a_state_idle
    on_ntry:
      actv: uedp_post_msg
      to: TASK_NORM_B
      sig: *sig5
      data: NULL
      ptype: NULL
    on_actv:
      steps:                # Chuyển trạng thái kèm hành động phức tạp
      - actv: uedp_post_msg
        to: TASK_NORM_B
        sig: *sig6
        data: NULL
        ptype: NULL
      - actv: uedp_itnlog_log
        to: NULL
        sig: NULL
        data: "[TASK_NORM_A][WAITING_B] Posted SIG_0xAA to TASK_NORM_B."
        ptype: NULL
    on_exit: NULL
  escal: # Cấu hình APE để xử lý khẩn cấp (nếu có)
    mode: slnf
    trigger:
    - on_sig: *sig7
      post_urgent: NULL       # Chạy tiếp queue hiện tại với ưu tiên cao
  << : *tnorm2-ctrl
- tnorm: TASK_NORM_B
  fsm:
  - id: fsm_task_b_state_idle
    on_recv:
    - sig: *sig5
      goto: fsm_task_b_state_busy
      steps:
      - actv: uedp_task_norm_post_msg
        to: TASK_NORM_A
        sig: *sig3
        data: *gda_status # Ghi log nội dung từ biến toàn cục
        ptype: VAL        # Validator check: Copy nội dung (memcpy)
      - actv: uedp_task_norm_post_msg
        to: TASK_NORM_A
        sig: *sig4
        data: *gda_status # Ghi log nội dung từ biến toàn cục
        ptype: VAL        # Validator check: Copy nội dung (memcpy)
        # sig: *gda_status # Validator check: Không hợp lệ, không thể dùng anchor trong sig
  - id: fsm_task_b_state_busy
    on_recv:
    - sig: *sig6
      goto: fsm_task_b_state_idle
      steps:
      - actv: uedp_task_norm_post_msg
        to: TASK_USR
        sig: *sig2
        data: *gda_status # Ghi log nội dung từ biến toàn cục
        ptype: REF        # Validator check: Truyền địa chỉ chuỗi status
      - actv: uedp_itnlog_log
        to: NULL
        sig: NULL
        data: *gda_status # Ghi log nội dung từ biến toàn cục
        ptype: VAL        # Validator check: Copy nội dung (memcpy)
  << : *tnorm3-ctrl # Validator check: Không hợp lệ, không thể dùng anchor trong sig
- tpoll: TASK_POLL_MEMRP
  exec: 
  - actv: pal_memrp_report()
    to: NULL
    sig: NULL
    data: NULL
    ptype: NULL
  << : *tpoll1 # Validator check: Không hợp lệ, thiếu anchor
- tpoll: TASK_POLL_BLINK
  exec: 
  - actv: pal_blink_led()
    to: NULL
    sig: NULL
    data: NULL
    ptype: NULL
  << : *tpoll2
# ANCHOR - Interrupt Service Routine (ISR) - Xử lý ngắt

isr:
- id: ISR_HARD_STOP
  to: TASK_NORM_A # Validator check: kiểm tra lỗi từ lstaxer.strucjec
  sig: *sig7

# ANCHOR - Out-Context Execution (OUTEXEC) - Thực thi ngoài ngữ cảnh

outexec:
- name: OCE_ITNLOG_DUMP
  handler: itnlog_dump_handler # Validator check: kiểm tra lỗi từ lstaxer.strucjec
  context: NULL
  state: READY
