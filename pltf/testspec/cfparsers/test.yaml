# test.yaml
project: "uEDP"

applg:
  # ==========================================
  # 1. TASK USR: QUẢN LÝ KHỞI CHẠY HỆ THỐNG (TSM)
  # ==========================================
  - task: KID_TASK_USR
    tsm:
      tstates:
        - id: STATE_USR_IDLE
          trans:
            - sig: KID_SIG_USR_START
              goto: STATE_USR_WAITING

        - id: STATE_USR_WAITING
          on_ntry: # Khi vừa vào trạng thái chờ, kích hoạt Task A
            steps:
              - action: post_msg
                to: KID_TASK_A
                sig: KID_SIG_USR_START
          trans:
            - sig: KID_SIG_USR_STOP
              goto: STATE_USR_IDLE
          on_exit:
            steps:
              - action: log
                data: "System Task USR: Sequence Finished."

  # ==========================================
  # 2. TASK A: ĐIỀU PHỐI TRUNG GIAN (TSM)
  # ==========================================
  - task: KID_TASK_A
    tsm:
      tstates:
        - id: STATE_A_IDLE
          trans:
            - sig: KID_SIG_USR_START
              goto: STATE_A_WAIT_B

        - id: STATE_A_WAIT_B
          on_ntry: # Gửi tín hiệu 0x12 cho B ngay khi vào trạng thái
            steps:
              - action: post_msg
                to: KID_TASK_B
                sig: KID_SIG_0x12
          trans:
            - sig: KID_SIG_0x34
              goto: STATE_A_WAIT_B # Stay: Tự bỏ qua bằng cách giữ nguyên trạng thái
            - sig: KID_SIG_0xFF
              goto: STATE_A_IDLE
          on_active: # Logging định kỳ nếu cần thiết
            act:
              action: log
              data: "Task A is waiting for B..."
          on_exit: # Khi thoát khỏi trạng thái chờ (do nhận 0xFF), gửi 0xAA cho B
            steps:
              - action: post_msg
                to: KID_TASK_B
                sig: KID_SIG_0xAA

  # ==========================================
  # 3. TASK B: XỬ LÝ PHẢN HỒI CHI TIẾT (FSM)
  # ==========================================
  - task: KID_TASK_B
    fsm:
      fstates:
        - id: STATE_B_IDLE
          on_recv:
            - sig: KID_SIG_0x12
              goto: STATE_B_BUSY
              steps: # Multi-step: Gửi đồng thời 0x34 và 0xFF cho A
                - action: post_msg
                  to: KID_TASK_A
                  sig: KID_SIG_0x34
                - action: post_msg
                  to: KID_TASK_A
                  sig: KID_SIG_0xFF

        - id: STATE_B_BUSY
          on_recv:
            - sig: KID_SIG_0xAA
              goto: STATE_B_IDLE
              act: # Single-step: Gửi tín hiệu STOP kết thúc hệ thống
                action: post_msg
                to: KID_TASK_USR
                sig: KID_SIG_USR_STOP